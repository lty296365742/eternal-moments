name: iOS Release (Ad Hoc)

# 手动触发：填写版本号后打包 .ipa
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (e.g. 1.0.1)'
        required: false
        default: '1.0'

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          set -e
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen

      - name: Generate Xcode project
        working-directory: mobile
        run: xcodegen --spec project.yml

      - name: Install Apple certificate and provisioning profile
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -e

          # Create temporary keychain
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain

          # Import certificate
          echo "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" build.keychain

          # Import provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/EternalMoments.mobileprovision

      - name: Build archive
        working-directory: mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.APPLE_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project EternalMoments.xcodeproj \
            -scheme EternalMoments \
            -destination "generic/platform=iOS" \
            -archivePath EternalMoments.xcarchive \
            -configuration Release \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            MARKETING_VERSION="${{ github.event.inputs.version }}" \
            build | xcpretty

      - name: Export .ipa
        working-directory: mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          sed -i '' "s/APPLE_TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/g" exportOptions.plist
          xcodebuild -exportArchive \
            -archivePath EternalMoments.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath ./build

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: EternalMoments-${{ github.event.inputs.version }}-${{ github.run_number }}
          path: mobile/build/*.ipa
          if-no-files-found: error
