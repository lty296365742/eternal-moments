# Eternal Moments — XcodeGen 工程定义
# 用法（在 Mac / CI 上）:
#   cd mobile && xcodegen --spec project.yml
# 会自动在 mobile/ 下生成 EternalMoments.xcodeproj（已 gitignore，不进仓库）

name: EternalMoments
options:
  bundleIdPrefix: com.eternalmoments
targets:
  EternalMoments:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: EternalMoments
    info:
      path: EternalMoments/Info.plist
      properties:
        UILaunchScreen:
          UILaunchScreen: {}
        NSContactsUsageDescription: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eternalmoments.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
