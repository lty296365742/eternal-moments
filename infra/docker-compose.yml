services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: eternal_moments
      POSTGRES_USER: em_user
      POSTGRES_PASSWORD: em_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # NOTE: local PostgreSQL 16 already listens on 5432 on this machine.
      # If the port binding conflicts, comment out the mapping below (or
      # change it to e.g. "15432:5432"); the backend connects via the
      # internal `postgres` host and does not need the published port.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U em_user -d eternal_moments"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    # Dockerfile CMD starts uvicorn only; run migrations first, then start
    # the server with the exact same uvicorn invocation.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://em_user:em_pass@postgres:5432/eternal_moments
      JWT_SECRET: dev_secret
      AI_PROVIDER: mock
      SMS_PROVIDER: mock
      VOLCANO_ARK_API_KEY: ${VOLCANO_ARK_API_KEY:-}
      VOLCANO_ARK_MODEL: ${VOLCANO_ARK_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - ../backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
