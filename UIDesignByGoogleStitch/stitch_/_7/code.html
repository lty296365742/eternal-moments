<script>
        function selectPreset(title) {
            // Clear all buttons
            document.querySelectorAll('.preset-btn').forEach(btn => {
                btn.classList.remove('bg-celebration-ruby', 'text-white', 'border-celebration-ruby');
                btn.classList.add('bg-surface-container');
            });
            
            // Highlight selected
            const activeBtn = document.getElementById('preset-' + title);
            activeBtn.classList.remove('bg-surface-container');
            activeBtn.classList.add('bg-celebration-ruby', 'text-white');
            
            // Set custom title input value if it's not "其他"
            const input = document.getElementById('custom-title');
            if (title !== '其他') {
                input.value = title;
            } else {
                input.value = '';
                input.focus();
            }
        }

        function setRepeat(type) {
            // Reset all checks
            ['Yearly', 'Monthly', 'Once'].forEach(t => {
                document.getElementById('check-' + t).classList.add('opacity-0');
            });
            // Show current check
            document.getElementById('check-' + type).classList.remove('opacity-0');
        }

        // Initialize defaults
        document.addEventListener('DOMContentLoaded', () => {
            selectPreset('结婚');
            
            // Initial scroll for date wheels to simulate selection
            const wheels = ['month-wheel', 'day-wheel', 'year-wheel'];
            wheels.forEach(id => {
                const wheel = document.getElementById(id);
                wheel.scrollTop = wheel.scrollHeight / 2 - wheel.clientHeight / 2;
            });
        });
    </script>
