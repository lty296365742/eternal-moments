<script>
        function selectLanguage(element) {
            // Remove checkmark from all items in the section
            const section = element.closest('.bg-secondary-background');
            const allCheckmarks = section.querySelectorAll('.material-symbols-outlined[data-icon="check"]');
            
            allCheckmarks.forEach(check => {
                check.classList.add('opacity-0');
                check.classList.remove('text-celebration-ruby');
            });

            // Add checkmark to selected item
            const currentCheck = element.querySelector('.material-symbols-outlined[data-icon="check"]');
            currentCheck.classList.remove('opacity-0');
            currentCheck.classList.add('text-celebration-ruby');

            // Feedback vibration if supported
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        // Add visual touch feedback for list items
        document.querySelectorAll('.ios-list-item').forEach(item => {
            item.addEventListener('touchstart', () => {
                item.style.backgroundColor = '#E5E5EA';
            });
            item.addEventListener('touchend', () => {
                setTimeout(() => {
                    item.style.backgroundColor = '';
                }, 100);
            });
        });
    </script>
