<button class="chip-select px-3 py-1.5 rounded-full text-label-caps font-label-caps bg-relationship-social/10 text-relationship-social border border-transparent transition-all active:scale-95" onclick="toggleChip(this)">母亲</button>

<script>
        function toggleChip(chip) {
            const isSelected = chip.classList.contains('ring-2');
            
            // Visual toggle logic
            if (isSelected) {
                chip.classList.remove('ring-2', 'ring-celebration-ruby/50', 'scale-105');
            } else {
                // Clear others if single select is desired (optional)
                // document.querySelectorAll('.chip-select').forEach(c => c.classList.remove('ring-2', 'ring-celebration-ruby/50', 'scale-105'));
                
                chip.classList.add('ring-2', 'ring-celebration-ruby/50', 'scale-105');
            }
        }

        // Haptic-like interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('opacity-70', 'scale-95');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('opacity-70', 'scale-95');
            });
        });
    </script>
