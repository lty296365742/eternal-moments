<script>
        function switchTab(tab) {
            const annTab = document.getElementById('tab-anniversaries');
            const holTab = document.getElementById('tab-holidays');
            const annContent = document.getElementById('content-anniversaries');
            const holContent = document.getElementById('content-holidays');

            if (tab === 'anniversaries') {
                annTab.classList.add('bg-white', 'text-on-surface', 'shadow-sm');
                annTab.classList.remove('text-on-surface-variant');
                holTab.classList.remove('bg-white', 'text-on-surface', 'shadow-sm');
                holTab.classList.add('text-on-surface-variant');
                
                annContent.classList.remove('hidden');
                holContent.classList.add('hidden');
            } else {
                holTab.classList.add('bg-white', 'text-on-surface', 'shadow-sm');
                holTab.classList.remove('text-on-surface-variant');
                annTab.classList.remove('bg-white', 'text-on-surface', 'shadow-sm');
                annTab.classList.add('text-on-surface-variant');
                
                holContent.classList.remove('hidden');
                annContent.classList.add('hidden');
            }
        }
